<svg xmlns="http://www.w3.org/2000/svg" width="460" height="230" viewBox="0 0 460 230"
     role="img" aria-label="A commutative triangle: f from R to S factors as f-bar composed with the projection pi from R onto R over I">
  <style>
    .arr    { fill: none; stroke: #1a1a1a; stroke-width: 1.6; }
    .arr-d  { fill: none; stroke: #c2410c; stroke-width: 1.6; stroke-dasharray: 6 5; }
    .obj    { font-family: Georgia, "Times New Roman", serif; font-size: 21px;
              font-style: italic; fill: #1a1a1a; }
    .lbl    { font-family: Georgia, "Times New Roman", serif; font-size: 15px;
              font-style: italic; fill: #1a1a1a; }
    .lbl-d  { font-family: Georgia, "Times New Roman", serif; font-size: 15px;
              font-style: italic; fill: #c2410c; }
  </style>
  <defs>
    <marker id="fh-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
    </marker>
    <marker id="fh-arrow-a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- objects -->
  <text class="obj" x="60"  y="52"  text-anchor="middle">R</text>
  <text class="obj" x="400" y="52"  text-anchor="middle">S</text>
  <text class="obj" x="205" y="192" text-anchor="middle">R / I</text>

  <!-- f : R -> S -->
  <line class="arr" x1="82" y1="45" x2="378" y2="45" marker-end="url(#fh-arrow)"/>
  <text class="lbl" x="230" y="32" text-anchor="middle">f</text>

  <!-- the canonical projection R ->> R/I -->
  <line class="arr" x1="62" y1="66" x2="170" y2="172" marker-end="url(#fh-arrow)"/>
  <text class="lbl" x="95" y="140" text-anchor="middle">π</text>
  <text class="lbl" x="106" y="146" text-anchor="middle" font-size="11">I</text>

  <!-- the induced map, unique because I is contained in ker f -->
  <line class="arr-d" x1="242" y1="172" x2="392" y2="66" marker-end="url(#fh-arrow-a)"/>
  <text class="lbl-d" x="337" y="146" text-anchor="middle">f̄</text>
</svg>
