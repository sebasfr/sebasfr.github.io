<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290"
     role="img" aria-label="Left: the line through a in the unit direction u inside the domain. Right: the one-variable function h maps to f(a + h u), whose slope at h = 0 is the directional derivative">
  <style>
    .ink { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
    .ink-thin { stroke: #1a1a1a; stroke-width: 1; fill: none; }
