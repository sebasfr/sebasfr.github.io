<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350"
     role="img" aria-label="Inside a ball around a, the path from a to x that first moves vertically to (a1,x2) and then horizontally to x; the mean value theorem is applied on each leg">
  <style>
    .ink { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
    .ink-thin { stroke: #1a1a1a; stroke-width: 1; fill: none; }
    .acc { stroke: #c2410c; stroke-width: 2.2; fill: none; }
    .acc-thin { stroke: #c2410c; stroke-width: 1.4; fill: none; }
    .gray { stroke: #8a8a8a; stroke-width: 1; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .lbl { font-family: Georgia, "Times New Roman", serif; font-size: 14px;
           font-style: italic; fill: #1a1a1a; }
    .lbl-acc { fill: #c2410c; }
    .lbl-gray { fill: #8a8a8a; }
    .cap { font-family: Georgia, "Times New Roman", serif; font-size: 13px;
           fill: #1a1a1a; }
    .dot { fill: #1a1a1a; }
    .dot-acc { fill: #c2410c; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <circle class="ink-thin dash" cx="300" cy="175" r="136.0"/>
  <polyline class="acc" points="300,175 300,103" marker-end="url(#ah-acc)"/>
  <polyline class="acc" points="300,103 404,103" marker-end="url(#ah-acc)"/>
  <circle class="dot" cx="300" cy="175" r="3.5"/>
  <circle class="dot" cx="300" cy="103" r="3.5"/>
  <circle class="dot" cx="404" cy="103" r="3.5"/>
  <circle class="dot-acc" cx="356" cy="103" r="4"/>
  <circle class="dot-acc" cx="300" cy="139" r="4"/>
  <text class="lbl" x="292" y="193" text-anchor="end">a = (a₁, a₂)</text>
  <text class="lbl" x="292" y="95" text-anchor="end">(a₁, x₂)</text>
  <text class="lbl" x="412" y="95" text-anchor="start">x = (x₁, x₂)</text>
  <text class="lbl lbl-acc" x="309" y="144" text-anchor="start">ξ₂ = (a₁, t₂)</text>
  <text class="lbl lbl-acc" x="356" y="123" text-anchor="middle">ξ₁ = (t₁, x₂)</text>
  <text class="lbl lbl-acc" x="240" y="155" text-anchor="end">h(t) = f(a₁, t)</text>
  <text class="lbl lbl-acc" x="352" y="91" text-anchor="middle">g(t) = f(t, x₂)</text>
  <text class="lbl" x="200" y="267" text-anchor="start">B<tspan dy="4" font-size="10">δ</tspan><tspan dy="-4"> </tspan>(a)</text>
  <text class="cap" x="320" y="335" text-anchor="middle">f(x) − f(a) = [g(x₁) − g(a₁)] + [h(x₂) − h(a₂)] = D₁f(ξ₁)(x₁ − a₁) + D₂f(ξ₂)(x₂ − a₂)</text>
</svg>
