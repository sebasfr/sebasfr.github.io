<svg xmlns="http://www.w3.org/2000/svg" width="640" height="335" viewBox="0 0 640 335"
     role="img" aria-label="The unit circle: near a point (a,b) with b nonzero it is the graph of a function y = g(x) over an interval A, but at (1,0) and (-1,0) the tangent is vertical and no such function exists">
  <style>
    .ink { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
    .ink-thin { stroke: #1a1a1a; stroke-width: 1; fill: none; }
