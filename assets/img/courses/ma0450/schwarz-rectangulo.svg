<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"
     role="img" aria-label="The rectangle with corners (x0,y0), (x0+h,y0), (x0,y0+k), (x0+h,y0+k) used in the proof of Schwarz's theorem; two mean value theorems locate a point (c,d) inside it">
  <style>
    .ink { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
    .ink-thin { stroke: #1a1a1a; stroke-width: 1; fill: none; }
    .acc { stroke: #c2410c; stroke-width: 2.2; fill: none; }
    .acc-thin { stroke: #c2410c; stroke-width: 1.4; fill: none; }
    .gray { stroke: #8a8a8a; stroke-width: 1; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .lbl { font-family: Georgia, "Times New Roman", serif; font-size: 14px;
           font-style: italic; fill: #1a1a1a; }
    .lbl-acc { fill: #c2410c; }
    .lbl-gray { fill: #8a8a8a; }
    .cap { font-family: Georgia, "Times New Roman", serif; font-size: 13px;
           fill: #1a1a1a; }
    .dot { fill: #1a1a1a; }
    .dot-acc { fill: #c2410c; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect class="ink" x="150" y="60" width="340" height="170"/>
  <circle class="dot" cx="150" cy="230" r="3.5"/>
  <circle class="dot" cx="490" cy="230" r="3.5"/>
  <circle class="dot" cx="150" cy="60" r="3.5"/>
  <circle class="dot" cx="490" cy="60" r="3.5"/>
  <text class="lbl" x="142" y="248" text-anchor="end">(x₀, y₀)</text>
  <text class="lbl" x="498" y="248" text-anchor="start">(x₀+h, y₀)</text>
  <text class="lbl" x="142" y="52" text-anchor="end">(x₀, y₀+k)</text>
  <text class="lbl" x="498" y="52" text-anchor="start">(x₀+h, y₀+k)</text>
  <line class="acc" x1="168" y1="145.0" x2="472" y2="145.0" marker-end="url(#ah-acc)"/>
  <text class="lbl lbl-acc" x="174" y="135" text-anchor="start">φ(x) = f(x, y₀+k) − f(x, y₀)</text>
  <line class="acc" x1="320.0" y1="212" x2="320.0" y2="78" marker-end="url(#ah-acc)"/>
  <text class="lbl lbl-acc" x="330" y="100" text-anchor="start">ψ(y) = D₁f(c, y)</text>
  <circle class="dot-acc" cx="320.0" cy="145.0" r="4"/>
  <text class="lbl lbl-acc" x="330" y="165" text-anchor="start">(c, d)</text>
  <line class="acc-thin dash" x1="320.0" y1="230" x2="320.0" y2="242"/>
  <text class="lbl lbl-acc" x="316" y="258" text-anchor="middle">c</text>
  <line class="acc-thin dash" x1="138" y1="145.0" x2="150" y2="145.0"/>
  <text class="lbl lbl-acc" x="132" y="150" text-anchor="end">d</text>
  <text class="cap" x="320" y="282" text-anchor="middle">Δ(h, k) = φ(x₀+h) − φ(x₀) = h · [ψ(y₀+k) − ψ(y₀)] = hk · D₂₁f(c, d)</text>
</svg>
